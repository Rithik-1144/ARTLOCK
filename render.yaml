services:
  - type: web
    name: artlock
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    preDeployCommand: cd /app && flask --app backend/run.py db upgrade
    healthCheckPath: /api/v1/health
    envVars:
      - key: ARTLOCK_ENV
        value: production
      - key: ARTLOCK_SECRET_KEY
        generateValue: true
      - key: ARTLOCK_ENCRYPTION_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: artlock-db
          property: connectionString
      - key: STORAGE_BACKEND
        value: s3
      - key: S3_BUCKET
        sync: false
      - key: AWS_REGION
        value: auto
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: RATELIMIT_STORAGE_URI
        value: memory://
databases:
  - name: artlock-db
    plan: free
