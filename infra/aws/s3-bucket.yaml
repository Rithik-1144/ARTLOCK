AWSTemplateFormatVersion: "2010-09-09"
Description: Private encrypted ArtLock object bucket with versioning and TLS-only access.

Parameters:
  BucketName:
    Type: String
    Description: Globally unique lowercase S3 bucket name.
    AllowedPattern: "^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$"

Resources:
  ArtLockBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref BucketName
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled

  ArtLockBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ArtLockBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt ArtLockBucket.Arn
              - !Sub "${ArtLockBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  ArtLockApplicationObjectPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Least-privilege ArtLock access to objects in this bucket.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - s3:GetObject
              - s3:PutObject
              - s3:DeleteObject
            Resource: !Sub "${ArtLockBucket.Arn}/*"

Outputs:
  BucketName:
    Value: !Ref ArtLockBucket
  BucketArn:
    Value: !GetAtt ArtLockBucket.Arn
  ApplicationObjectPolicyArn:
    Value: !Ref ArtLockApplicationObjectPolicy
